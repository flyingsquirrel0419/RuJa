      - name: Verify Temporal.Duration add/compare tooling
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_temporal_duration_math_tooling_test -v
        working-directory: tools
      - name: Require exact Temporal.Duration add/compare (84/84)
        run: |
          mapfile -t files < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_duration_math_admission.txt)
          test "${#files[@]}" -eq 84
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${files[@]}" | tee temporal_duration_math_result.txt
          grep -q '^RATE=100.0 PASS=84 FAIL=0 SKIP=0 TOTAL=84 RAN=84$' \
