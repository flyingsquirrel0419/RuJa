          grep -q '^RATE=100.0 PASS=128 FAIL=0 SKIP=0 TOTAL=128 RAN=128$' \
            temporal_calendar_siblings_formatter_diagnostic.txt
      - name: Run exact Temporal.PlainTime admissions
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_plain_time_core_admission.txt \
              tools/test262_temporal_plain_time_from_admission.txt \
              tools/test262_temporal_plain_time_value_of_admission.txt \
              tools/test262_temporal_plain_time_equals_admission.txt \
              tools/test262_temporal_plain_time_compare_admission.txt \
              tools/test262_temporal_plain_time_to_string_admission.txt \
              tools/test262_temporal_plain_time_to_json_admission.txt \
              tools/test262_temporal_plain_time_round_admission.txt \
              tools/test262_temporal_plain_time_with_admission.txt \
              tools/test262_temporal_plain_time_add_admission.txt \
              tools/test262_temporal_plain_time_subtract_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_plain_time_diagnostic.py \
            "${files[@]}" | tee temporal_plain_time_result.txt
          grep -q '^RATE=100.0 PASS=336 FAIL=0 SKIP=0 TOTAL=336 RAN=336$' \
            temporal_plain_time_result.txt
          mapfile -t with_files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_plain_time_with_admission.txt \
              tools/test262_temporal_plain_time_with_blockers.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_plain_time_diagnostic.py \
            "${with_files[@]}" | tee temporal_plain_time_with_result.txt
          grep -q '^RATE=100.0 PASS=22 FAIL=0 SKIP=0 TOTAL=22 RAN=22$' \
            temporal_plain_time_with_result.txt
      - name: Run exact PlainDate.toPlainDateTime admissions
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_plain_date_to_plain_date_time_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_plain_date_to_plain_date_time_diagnostic.py \
            "${files[@]}" | tee temporal_plain_date_to_plain_date_time_result.txt
          grep -q '^RATE=100.0 PASS=35 FAIL=0 SKIP=0 TOTAL=35 RAN=35$' \
            temporal_plain_date_to_plain_date_time_result.txt
      - name: Run test262 subset
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            language/expressions/arrow-function \
            language/expressions/function \
            language/expressions/object \
            language/identifiers \
            language/keywords \
            language/types \
            language/comments \
            language/white-space \
            language/punctuators > test262_result.txt 2>&1
          cat test262_result.txt
      - name: Publish pass rate to job summary
        if: always()
        run: |
          rate=$(grep '^RATE=' test262_result.txt | sed 's/RATE=//;s/ .*//')
          pass=$(grep '^RATE=' test262_result.txt | sed 's/.*PASS=//;s/ .*//')
          fail=$(grep '^RATE=' test262_result.txt | sed 's/.*FAIL=//;s/ .*//')
          {
            echo "## test262 conformance"
            echo ""
            echo "**Pass rate: ${rate}%** - ${pass} passed, ${fail} failed"
            echo "(subset: arrow-function, function, object, identifiers, keywords, types, comments, white-space, punctuators; unsupported-feature tests are skipped)"
            echo ""
            echo "<details><summary>Full breakdown</summary>"
            echo ""
            echo '```'
            cat test262_result.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
      - name: Upload test262 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-result
          path: test262_result.txt
