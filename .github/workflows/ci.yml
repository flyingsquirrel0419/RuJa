name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TEST262_REV: 9e61c12835c5e4a3bdba93850427e6742c4f64c4

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build
        run: cargo build --all-targets --all-features --verbose
      - name: Run tests
        run: cargo test --all-targets --all-features --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify generated Intl aliases
        run: python3 tools/generate_intl_aliases.py --check
      - name: Verify generated Intl Locale-info data
        run: python3 tools/generate_intl_locale_info.py --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test vendored RegExp engine
        run: >-
          cargo test --manifest-path vendor/regress/Cargo.toml
          --features utf16,backend-pikevm --lib
      - name: Clippy vendored RegExp engine
        run: >-
          cargo clippy --manifest-path vendor/regress/Cargo.toml
          --all-targets --features utf16,backend-pikevm -- -D warnings
      - name: Check vendored RegExp no_std
        run: >-
          cargo check --manifest-path vendor/regress/Cargo.toml
          --no-default-features --features alloc,backend-pikevm,utf16
      - name: Check wasm32
        run: cargo check --target wasm32-unknown-unknown --all-features
      - name: Test test262 tooling
        run: python3 tools/test262_tooling_test.py

  test262:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build RuJa (release)
        run: cargo build --release
      - name: Test release Realm registry rollback
        run: >-
          cargo test --release --lib
          vm::allocation_tests::failed_realm_construction_rolls_back_every_heap_boundary
          -- --exact
      - name: Checkout pinned test262 (sparse)
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/language/expressions/arrow-function
            test/language/expressions/function
            test/language/expressions/object
            test/language/identifiers
            test/language/keywords
            test/language/types
            test/language/comments
            test/language/white-space
            test/language/punctuators
            test/built-ins/Temporal/Duration/prototype/abs
            test/built-ins/Temporal/Duration/prototype/negated
            test/built-ins/Temporal/Duration/prototype/with
            test/built-ins/Temporal/Duration/prototype/valueOf
            test/built-ins/Temporal/Duration/prototype/toString
            test/built-ins/Temporal/Duration/prototype/toJSON
            test/built-ins/Temporal/Duration/prototype/total
            test/built-ins/Temporal/PlainMonthDay
            test/built-ins/Temporal/PlainTime
            test/built-ins/Temporal/PlainDate/prototype/toPlainDateTime
            test/built-ins/Temporal/PlainYearMonth
      - name: Run exact Temporal.Duration.prototype.with admission
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_duration_with_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_duration_with_diagnostic.py \
            "${files[@]}" | tee temporal_duration_with_result.txt
          grep -q '^RATE=100.0 PASS=22 FAIL=0 SKIP=0 TOTAL=22 RAN=22$' \
            temporal_duration_with_result.txt
      - name: Run exact Temporal.Duration unary admissions
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_duration_abs_admission.txt \
              tools/test262_temporal_duration_negated_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_duration_unary_diagnostic.py \
            "${files[@]}" | tee temporal_duration_unary_result.txt
          grep -q '^RATE=100.0 PASS=17 FAIL=0 SKIP=0 TOTAL=17 RAN=17$' \
            temporal_duration_unary_result.txt
      - name: Run exact Temporal.Duration.prototype.valueOf admission
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_duration_value_of_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_runner.py \
            "${files[@]}" | tee temporal_duration_value_of_result.txt
          grep -q '^RATE=100.0 PASS=7 FAIL=0 SKIP=0 TOTAL=7 RAN=7$' \
            temporal_duration_value_of_result.txt
      - name: Run exact Temporal.Duration.prototype.toString admission
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_duration_to_string_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_duration_to_string_diagnostic.py \
            "${files[@]}" | tee temporal_duration_to_string_result.txt
          grep -q '^RATE=100.0 PASS=44 FAIL=0 SKIP=0 TOTAL=44 RAN=44$' \
            temporal_duration_to_string_result.txt
      - name: Run exact Temporal.Duration.prototype.toJSON admission
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_duration_to_json_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_duration_to_json_diagnostic.py \
            "${files[@]}" | tee temporal_duration_to_json_result.txt
          grep -q '^RATE=100.0 PASS=12 FAIL=0 SKIP=0 TOTAL=12 RAN=12$' \
            temporal_duration_to_json_result.txt
      - name: Run exact Temporal.Duration.prototype.total admission
        run: |
          mapfile -t admitted < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_duration_total_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${admitted[@]}" | tee temporal_duration_total_result.txt
          grep -q '^RATE=100.0 PASS=78 FAIL=0 SKIP=0 TOTAL=78 RAN=78$' \
            temporal_duration_total_result.txt
          mapfile -t complete < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_duration_total_admission.txt \
            tools/test262_temporal_duration_total_false_positives.txt \
            tools/test262_temporal_duration_total_blockers.txt)
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_duration_total_diagnostic.py \
            "${complete[@]}" | tee temporal_duration_total_diagnostic.txt
          grep -q '^RATE=100.0 PASS=78 FAIL=0 SKIP=0 TOTAL=78 RAN=78$' \
            temporal_duration_total_diagnostic.txt
      - name: Run exact Temporal calendar sibling core admission
        run: |
          mapfile -t admitted < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_calendar_siblings_core_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${admitted[@]}" | tee temporal_calendar_siblings_core_result.txt
          grep -q '^RATE=100.0 PASS=93 FAIL=0 SKIP=0 TOTAL=93 RAN=93$' \
            temporal_calendar_siblings_core_result.txt
          mapfile -t complete < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_calendar_siblings_core_admission.txt \
            tools/test262_temporal_calendar_siblings_core_blockers.txt)
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_calendar_siblings_core_diagnostic.py \
            "${complete[@]}" | tee temporal_calendar_siblings_core_diagnostic.txt
          grep -q '^RATE=89.4 PASS=93 FAIL=11 SKIP=0 TOTAL=104 RAN=104$' \
            temporal_calendar_siblings_core_diagnostic.txt
      - name: Run exact Temporal calendar sibling factory admission
        run: |
          mapfile -t admitted < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_calendar_siblings_from_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${admitted[@]}" | tee temporal_calendar_siblings_from_result.txt
          grep -q '^RATE=100.0 PASS=74 FAIL=0 SKIP=0 TOTAL=74 RAN=74$' \
            temporal_calendar_siblings_from_result.txt
          mapfile -t complete < <(grep -hEv '^(#|$)' \
            tools/test262_temporal_calendar_siblings_from_admission.txt \
            tools/test262_temporal_calendar_siblings_from_blockers.txt)
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_calendar_siblings_from_diagnostic.py \
            "${complete[@]}" | tee temporal_calendar_siblings_from_diagnostic.txt
          grep -q '^RATE=60.2 PASS=74 FAIL=49 SKIP=0 TOTAL=123 RAN=123$' \
            temporal_calendar_siblings_from_diagnostic.txt
      - name: Run exact Temporal.PlainTime admissions
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_plain_time_core_admission.txt \
              tools/test262_temporal_plain_time_from_admission.txt \
              tools/test262_temporal_plain_time_value_of_admission.txt \
              tools/test262_temporal_plain_time_equals_admission.txt \
              tools/test262_temporal_plain_time_compare_admission.txt \
              tools/test262_temporal_plain_time_to_string_admission.txt \
              tools/test262_temporal_plain_time_to_json_admission.txt \
              tools/test262_temporal_plain_time_round_admission.txt \
              tools/test262_temporal_plain_time_with_admission.txt \
              tools/test262_temporal_plain_time_add_admission.txt \
              tools/test262_temporal_plain_time_subtract_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_plain_time_diagnostic.py \
            "${files[@]}" | tee temporal_plain_time_result.txt
          grep -q '^RATE=100.0 PASS=336 FAIL=0 SKIP=0 TOTAL=336 RAN=336$' \
            temporal_plain_time_result.txt
          mapfile -t with_files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_plain_time_with_admission.txt \
              tools/test262_temporal_plain_time_with_blockers.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_plain_time_diagnostic.py \
            "${with_files[@]}" | tee temporal_plain_time_with_result.txt
          grep -q '^RATE=100.0 PASS=22 FAIL=0 SKIP=0 TOTAL=22 RAN=22$' \
            temporal_plain_time_with_result.txt
      - name: Run exact PlainDate.toPlainDateTime admissions
        run: |
          mapfile -t files < <(
            grep -hEv '^(#|$)' \
              tools/test262_temporal_plain_date_to_plain_date_time_admission.txt
          )
          TEST262="$GITHUB_WORKSPACE/test262" \
            python3 tools/test262_temporal_plain_date_to_plain_date_time_diagnostic.py \
            "${files[@]}" | tee temporal_plain_date_to_plain_date_time_result.txt
          grep -q '^RATE=100.0 PASS=35 FAIL=0 SKIP=0 TOTAL=35 RAN=35$' \
            temporal_plain_date_to_plain_date_time_result.txt
      - name: Run test262 subset
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            language/expressions/arrow-function \
            language/expressions/function \
            language/expressions/object \
            language/identifiers \
            language/keywords \
            language/types \
            language/comments \
            language/white-space \
            language/punctuators > test262_result.txt 2>&1
          cat test262_result.txt
      - name: Publish pass rate to job summary
        if: always()
        run: |
          rate=$(grep '^RATE=' test262_result.txt | sed 's/RATE=//;s/ .*//')
          pass=$(grep '^RATE=' test262_result.txt | sed 's/.*PASS=//;s/ .*//')
          fail=$(grep '^RATE=' test262_result.txt | sed 's/.*FAIL=//;s/ .*//')
          {
            echo "## test262 conformance"
            echo ""
            echo "**Pass rate: ${rate}%** - ${pass} passed, ${fail} failed"
            echo "(subset: arrow-function, function, object, identifiers, keywords, types, comments, white-space, punctuators; unsupported-feature tests are skipped)"
            echo ""
            echo "<details><summary>Full breakdown</summary>"
            echo ""
            echo '```'
            cat test262_result.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
      - name: Upload test262 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-result
          path: test262_result.txt
