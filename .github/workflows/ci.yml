name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TEST262_REV: 9e61c12835c5e4a3bdba93850427e6742c4f64c4

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build
        run: cargo build --all-targets --all-features --verbose
      - name: Run tests
        run: cargo test --all-targets --all-features --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify generated Intl aliases
        run: python3 tools/generate_intl_aliases.py --check
      - name: Verify generated Intl Locale-info data
        run: python3 tools/generate_intl_locale_info.py --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test vendored RegExp engine
        run: >-
          cargo test --manifest-path vendor/regress/Cargo.toml
          --features utf16,backend-pikevm --lib
      - name: Clippy vendored RegExp engine
        run: >-
          cargo clippy --manifest-path vendor/regress/Cargo.toml
          --all-targets --features utf16,backend-pikevm -- -D warnings
      - name: Check vendored RegExp no_std
        run: >-
          cargo check --manifest-path vendor/regress/Cargo.toml
          --no-default-features --features alloc,backend-pikevm,utf16
      - name: Check wasm32
        run: cargo check --target wasm32-unknown-unknown --all-features
      - name: Test test262 tooling
        run: python3 tools/test262_tooling_test.py
      - name: Test PlainDateTime difference tooling
        working-directory: tools
        run: python3 -m unittest test262_temporal_plain_date_time_difference_tooling_test -v

  test262:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build RuJa (release)
        run: cargo build --release
      - name: Test release Realm registry rollback
        run: >-
          cargo test --release --lib
          vm::allocation_tests::failed_realm_construction_rolls_back_every_heap_boundary
          -- --exact
      - name: Checkout pinned test262 (sparse)
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/language/expressions/arrow-function
            test/language/expressions/function
            test/language/expressions/object
            test/language/identifiers
            test/language/keywords
            test/language/types
            test/language/comments
            test/language/white-space
            test/language/punctuators
            test/built-ins/Temporal/PlainDateTime/prototype/toPlainDate
            test/built-ins/Temporal/PlainDateTime/prototype/toPlainTime
            test/built-ins/Temporal/PlainDateTime/prototype/withPlainTime
            test/built-ins/Temporal/PlainDateTime/prototype/add
            test/built-ins/Temporal/PlainDateTime/prototype/subtract
            test/built-ins/Temporal/PlainDateTime
            test/intl402/Temporal/PlainDateTime
            test/built-ins/Temporal/Duration/prototype/abs
            test/built-ins/Temporal/Duration/prototype/negated
            test/built-ins/Temporal/Duration/prototype/with
            test/built-ins/Temporal/Duration/prototype/valueOf
            test/built-ins/Temporal/Duration/prototype/toString
            test/built-ins/Temporal/Duration/prototype/toJSON
            test/built-ins/Temporal/Duration/prototype/total
            test/built-ins/Temporal/Duration/prototype/round
            test/built-ins/Temporal/Duration/prototype/add
            test/built-ins/Temporal/Duration/compare
            test/built-ins/Temporal/Duration/prototype/subtract/float64-representable-integer.js
            test/built-ins/Temporal/Instant/prototype/since/float64-representable-integer.js
            test/built-ins/Temporal/Instant/prototype/until/float64-representable-integer.js
            test/built-ins/Temporal/ZonedDateTime/prototype/since/float64-representable-integer.js
            test/built-ins/Temporal/ZonedDateTime/prototype/until/float64-representable-integer.js
            test/intl402/Temporal/Duration/compare
            test/built-ins/Temporal/PlainMonthDay
            test/intl402/Temporal/PlainMonthDay
            test/intl402/DateTimeFormat/prototype/formatRangeToParts
            test/intl402/DateTimeFormat/prototype/formatToParts
            test/built-ins/Temporal/PlainTime
            test/built-ins/Temporal/PlainDate/prototype/toPlainDateTime
            test/built-ins/Temporal/PlainDate/prototype/toPlainMonthDay
            test/built-ins/Temporal/PlainDate/prototype/toPlainYearMonth
            test/built-ins/Temporal/PlainDate/prototype/with
            test/built-ins/Temporal/PlainDate/prototype/withCalendar
            test/built-ins/Temporal/PlainDate/prototype/since/argument-plaindatetime.js
            test/built-ins/Temporal/PlainDate/prototype/until/argument-plaindatetime.js
            test/built-ins/Temporal/PlainTime/prototype/since/argument-zoneddatetime-balance-negative-time-units.js
            test/built-ins/Temporal/PlainTime/prototype/until/argument-zoneddatetime-balance-negative-time-units.js
            test/built-ins/Temporal/PlainDateTime/prototype/withCalendar
            test/built-ins/Temporal/PlainDateTime/prototype/toString
            test/built-ins/Temporal/PlainDateTime/prototype/toJSON
            test/built-ins/Temporal/PlainDateTime/prototype/until/balance.js
            test/built-ins/Temporal/ZonedDateTime/prototype/withCalendar
            test/built-ins/Temporal/ZonedDateTime/prototype/with
            test/built-ins/Temporal/ZonedDateTime/prototype/since/argument-at-limits.js
            test/built-ins/Temporal/ZonedDateTime/prototype/until/argument-at-limits.js
            test/intl402/Temporal/ZonedDateTime/prototype/with
            test/intl402/Temporal/ZonedDateTime/prototype/since
            test/intl402/Temporal/ZonedDateTime/prototype/until
            test/built-ins/Temporal/PlainYearMonth
            test/built-ins/Temporal/PlainYearMonth/prototype/toJSON
            test/built-ins/Temporal/PlainYearMonth/prototype/toPlainDate
            test/intl402/Temporal/PlainYearMonth
            test/intl402/Temporal/PlainDate
            test/intl402/Temporal/PlainDateTime
            test/intl402/Temporal/ZonedDateTime
            test/intl402/Temporal/Duration/prototype/round
            test/intl402/Temporal/ZonedDateTime/prototype/round
            test/intl402/DateTimeFormat/prototype/formatRange
            test/staging/Temporal
      - name: Verify live Temporal.PlainYearMonth tooling
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_plain_year_month_equals_surface_is_exact_live_disjoint_and_shared
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_plain_month_day_to_json_surface_is_exact_live_disjoint_and_shared
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_plain_month_day_to_json_intl_and_downstream_are_exact
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_plain_month_day_to_plain_date_surface_is_exact_live_disjoint_and_shared
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_plain_month_day_to_plain_date_intl_and_downstream_are_exact
