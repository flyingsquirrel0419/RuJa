          test262_tooling_test.ModuleCoreAdmissionTests.test_annex_b_date_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact RegExp compile admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_regexp_compile_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact legacy RegExp accessor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_regexp_legacy_accessor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact primitive Reference admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_reference_primitive_manifest_is_exact_and_shared
          -v
      - name: Verify exact Map constructor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_map_constructor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Set constructor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_set_constructor_manifest_is_exact_live_disjoint_and_shared
          -v
