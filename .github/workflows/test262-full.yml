# Full test262 conformance run split into parallel jobs by directory.
# Each runner processes one immediate child directory of test262/test,
# but language/ is expanded to its own subdirectories so the top-level
# language directory is not also re-run in full.

name: test262-full

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TEST262_REV: 9e61c12835c5e4a3bdba93850427e6742c4f64c4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build RuJa (release)
        run: cargo build --release
      - name: Upload RuJa binary
        uses: actions/upload-artifact@v4
        with:
          name: ruja-release
          path: target/release/ruja

  setup:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
      - name: Verify exact TypedArray string admissions
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.TypedArrayJoinAdmissionTests
          test262_tooling_test.TypedArrayToStringAdmissionTests
          test262_tooling_test.TypedArrayToLocaleStringAdmissionTests -v
      - name: Verify exact language early-error admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_language_early_error_admission_is_exact_and_shared
          -v
      - name: Verify exact module class-elements admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_module_class_elements_manifest_is_exact_and_shared
          -v
      - name: Verify exact class built-in subclass admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ClassSubclassBuiltinAdmissionTests
          -v
      - name: Verify exact SuppressedError admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_suppressed_error_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal namespace admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_namespace_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant core admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_core_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant epoch factory admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_epoch_factory_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact static import-attribute admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_static_import_attributes_manifest_is_exact_live_and_shared
          -v
      - name: Verify exact Function.prototype.bind admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_function_bind_admission_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Function.prototype.toString admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_function_tostring_admission_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact ShadowRealm admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_shadowrealm_admission_is_exact_live_and_shared
          -v
      - name: Verify exact Annex B String admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_annex_b_string_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Annex B escape admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_annex_b_escape_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Annex B Date admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_annex_b_date_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact RegExp compile admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_regexp_compile_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact legacy RegExp accessor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_regexp_legacy_accessor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact primitive Reference admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_reference_primitive_manifest_is_exact_and_shared
          -v
      - name: Verify exact Map constructor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_map_constructor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Set constructor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_set_constructor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Set algebra admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_set_algebra_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Weak collection admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_weak_collection_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact extensibility admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_extensibility_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact RegExp Unicode-set admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.RegExpUnicodeSetsAdmissionTests
          -v
      - name: Verify exact RegExp named-group admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.RegExpNamedGroupsAdmissionTests
          -v
      - name: Verify exact residual Annex B RegExp admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_regexp_annex_b_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Build directory matrix
        id: dirs
        run: |
          # Enumerate test262/test children. language/ is expanded into its
          # subdirectories; do not also include language/ itself.
          dirs=$(cd test262/test && {
            find . -maxdepth 1 -mindepth 1 -type d | sed 's|^\./||' | grep -vxE 'harness|language|intl402|staging'
            find ./language -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sed 's|^\./||'
            printf '%s\n' \
              staging/built-ins/Object/preventExtensions \
              staging/built-ins/Reflect/preventExtensions
          } | sort -u | jq -R . | jq -s -c .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "matrix directories: $dirs"

  regexp-unicode-sets:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned test262 RegExp string sets
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/RegExp/unicodeSets/generated
            test/built-ins/RegExp/property-escapes/generated/strings
      - name: Require all 142 RegExp Unicode-set files to pass
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/RegExp/unicodeSets/generated \
            built-ins/RegExp/property-escapes/generated/strings \
            > regexp_unicode_sets_result.txt 2>&1
          cat regexp_unicode_sets_result.txt
          grep -q '^RATE=100.0 PASS=142 FAIL=0 SKIP=0 TOTAL=142 RAN=142$' \
            regexp_unicode_sets_result.txt

  suppressed-error:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned SuppressedError tests
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/SuppressedError
      - name: Require the exact SuppressedError boundary to pass
        run: |
          mapfile -t files < <(sed -e '/^#/d' -e '/^$/d' \
            tools/test262_suppressed_error_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${files[@]}" > suppressed_error_result.txt 2>&1
          cat suppressed_error_result.txt
          grep -q '^RATE=100.0 PASS=22 FAIL=0 SKIP=0 TOTAL=22 RAN=22$' \
            suppressed_error_result.txt

  temporal-namespace:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned Temporal namespace tests
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/Temporal/toStringTag
            test/built-ins/Temporal/Now/toStringTag
      - name: Require the exact Temporal namespace boundary to pass
        run: |
          mapfile -t files < <(sed -e '/^#/d' -e '/^$/d' \
