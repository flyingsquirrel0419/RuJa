# Full test262 conformance run split into parallel jobs by directory.
# Each runner processes one immediate child directory of test262/test,
# but language/ is expanded to its own subdirectories so the top-level
# language directory is not also re-run in full.

name: test262-full

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TEST262_REV: 9e61c12835c5e4a3bdba93850427e6742c4f64c4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build RuJa (release)
        run: cargo build --release
      - name: Upload RuJa binary
        uses: actions/upload-artifact@v4
        with:
          name: ruja-release
          path: target/release/ruja

  setup:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
      - name: Verify exact TypedArray string admissions
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.TypedArrayJoinAdmissionTests
          test262_tooling_test.TypedArrayToStringAdmissionTests
          test262_tooling_test.TypedArrayToLocaleStringAdmissionTests -v
      - name: Verify exact language early-error admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_language_early_error_admission_is_exact_and_shared
          -v
      - name: Verify exact Function.prototype.bind admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_function_bind_admission_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Map constructor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_map_constructor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Set constructor admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_set_constructor_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Weak collection admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_weak_collection_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact extensibility admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_extensibility_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact RegExp Unicode-set admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.RegExpUnicodeSetsAdmissionTests
          -v
      - name: Build directory matrix
        id: dirs
        run: |
          # Enumerate test262/test children. language/ is expanded into its
          # subdirectories; do not also include language/ itself.
          dirs=$(cd test262/test && {
            find . -maxdepth 1 -mindepth 1 -type d | sed 's|^\./||' | grep -vxE 'harness|language|intl402|staging'
            find ./language -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sed 's|^\./||'
            printf '%s\n' \
              staging/built-ins/Object/preventExtensions \
              staging/built-ins/Reflect/preventExtensions
          } | sort -u | jq -R . | jq -s -c .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "matrix directories: $dirs"

  regexp-unicode-sets:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned test262 RegExp string sets
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/RegExp/unicodeSets/generated
            test/built-ins/RegExp/property-escapes/generated/strings
      - name: Require all 142 RegExp Unicode-set files to pass
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/RegExp/unicodeSets/generated \
            built-ins/RegExp/property-escapes/generated/strings \
            > regexp_unicode_sets_result.txt 2>&1
          cat regexp_unicode_sets_result.txt
          grep -q '^RATE=100.0 PASS=142 FAIL=0 SKIP=0 TOTAL=142 RAN=142$' \
            regexp_unicode_sets_result.txt

  weak-collections:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned test262 WeakMap and WeakSet tests
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/WeakMap
            test/built-ins/WeakSet
      - name: Require all 226 WeakMap and WeakSet files to pass
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/WeakMap built-ins/WeakSet \
            > weak_collections_result.txt 2>&1
          cat weak_collections_result.txt
          grep -q '^RATE=100.0 PASS=226 FAIL=0 SKIP=0 TOTAL=226 RAN=226$' \
            weak_collections_result.txt

  test262-full:
    needs: [build, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.setup.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - name: Make RuJa executable
        run: chmod +x target/release/ruja
      - name: Checkout pinned test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
      - name: Run test262 /${{ matrix.dir }}
        run: |
          DIR="${{ matrix.dir }}"
          SAFE_DIR="${DIR//\//_}"
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py "$DIR" > "test262_${SAFE_DIR}_result.txt" 2>&1
          cat "test262_${SAFE_DIR}_result.txt"
      - name: Publish /${{ matrix.dir }} pass rate
        if: always()
        run: |
          DIR="${{ matrix.dir }}"
          SAFE_DIR="${DIR//\//_}"
          FILE="test262_${SAFE_DIR}_result.txt"
          rate=$(grep '^RATE=' "$FILE" | sed 's/RATE=//;s/ .*//')
          pass=$(grep '^RATE=' "$FILE" | sed 's/.*PASS=//;s/ .*//')
          fail=$(grep '^RATE=' "$FILE" | sed 's/.*FAIL=//;s/ .*//')
          total=$(grep '^RATE=' "$FILE" | sed 's/.*TOTAL=//;s/ .*//')
          {
            echo "## test262 /${{ matrix.dir }}"
            echo ""
            echo "**Pass rate: ${rate}%** - ${pass} passed, ${fail} failed, ${total} total"
            echo "(unsupported-feature tests are skipped)"
            echo ""
            echo "<details><summary>Full breakdown for /${{ matrix.dir }}</summary>"
            echo ""
            echo '```'
            cat "$FILE"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload /${{ matrix.dir }} result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-${{ strategy.job-index }}-result
          path: test262_*_result.txt

  summary:
    needs: test262-full
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all test262 results
        uses: actions/download-artifact@v4
        with:
          path: test262-results
          pattern: test262-*-result
      - name: Aggregate and publish
        run: |
          total_pass=0
          total_fail=0
          total_skip=0
          total_total=0
          for f in test262-results/test262-*-result/*_result.txt; do
            [ -f "$f" ] || continue
            pass=$(grep '^RATE=' "$f" | sed 's/.*PASS=//;s/ .*//')
            fail=$(grep '^RATE=' "$f" | sed 's/.*FAIL=//;s/ .*//')
            skip=$(grep '^RATE=' "$f" | sed 's/.*SKIP=//;s/ .*//')
            total=$(grep '^RATE=' "$f" | sed 's/.*TOTAL=//;s/ .*//')
            total_pass=$((total_pass + ${pass:-0}))
            total_fail=$((total_fail + ${fail:-0}))
            total_skip=$((total_skip + ${skip:-0}))
            total_total=$((total_total + ${total:-0}))
          done
          ran=$((total_pass + total_fail))
          if [ "$ran" -gt 0 ]; then
            rate=$(awk "BEGIN { printf \"%.1f\", $total_pass * 100 / $ran }")
          else
            rate=0.0
          fi
          {
            echo "## test262 conformance (full, aggregate)"
            echo ""
            echo "**Pass rate: ${rate}%** - ${total_pass} passed, ${total_fail} failed, ${total_skip} skipped, ${total_total} total"
            echo ""
            echo '```'
            echo "Total tests: ${total_total}"
            echo "Actually run:  ${ran}"
            echo "Passed:        ${total_pass}"
            echo "Failed:        ${total_fail}"
            echo "Skipped:       ${total_skip}"
            echo "Pass rate:     ${rate}%"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
