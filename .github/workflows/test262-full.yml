      - name: Require the exact Temporal.Instant core boundary to pass
        run: |
          mapfile -t files < <(sed -e '/^#/d' -e '/^$/d' \
            tools/test262_temporal_instant_core_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${files[@]}" > temporal_instant_core_result.txt 2>&1
          cat temporal_instant_core_result.txt
          grep -q '^RATE=100.0 PASS=19 FAIL=0 SKIP=0 TOTAL=19 RAN=19$' \
