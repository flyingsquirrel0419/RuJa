            test/built-ins/FinalizationRegistry
      - name: Verify the frozen weak-reference manifest
        run: >-
          PYTHONPATH=tools TEST262="$GITHUB_WORKSPACE/test262"
          python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_weak_reference_manifest_is_exact_live_disjoint_and_shared
      - name: Require the exact weak-reference boundary to pass
        run: |
          mapfile -t files < <(sed -e '/^#/d' -e '/^$/d' \
