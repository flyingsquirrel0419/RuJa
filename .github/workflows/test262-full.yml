            test/language/literals/regexp/named-groups
      - name: Verify the frozen named-group manifest
        run: >-
          PYTHONPATH=tools TEST262="$GITHUB_WORKSPACE/test262"
          python3 -m unittest
          test262_tooling_test.RegExpNamedGroupsAdmissionTests
      - name: Require the exact named-group boundary to pass
        run: |
          mapfile -t files < <(sed -e '/^#/d' -e '/^$/d' \
            tools/test262_regexp_named_groups_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${files[@]}" > regexp_named_groups_result.txt 2>&1
          cat regexp_named_groups_result.txt
          grep -q '^RATE=100.0 PASS=86 FAIL=0 SKIP=0 TOTAL=86 RAN=86$' \
            regexp_named_groups_result.txt
      - name: Require the related named-group scope to stay closed
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/RegExp/named-groups \
            language/literals/regexp/named-groups \
            built-ins/RegExp/prototype/Symbol.replace/named-groups-fn.js \
            built-ins/RegExp/prototype/Symbol.replace/named-groups.js \
            built-ins/RegExp/prototype/Symbol.replace/poisoned-stdlib.js \
            built-ins/RegExp/prototype/Symbol.replace/result-coerce-groups-err.js \
            built-ins/RegExp/prototype/Symbol.replace/result-coerce-groups-prop-err.js \
            built-ins/RegExp/prototype/Symbol.replace/result-coerce-groups-prop.js \
            built-ins/RegExp/prototype/Symbol.replace/result-coerce-groups.js \
            built-ins/RegExp/prototype/Symbol.replace/result-get-groups-err.js \
            built-ins/RegExp/prototype/Symbol.replace/result-get-groups-prop-err.js \
            > regexp_named_groups_scope_result.txt 2>&1
          cat regexp_named_groups_scope_result.txt
          grep -q '^RATE=100.0 PASS=100 FAIL=0 SKIP=1 TOTAL=101 RAN=100$' \
            regexp_named_groups_scope_result.txt

