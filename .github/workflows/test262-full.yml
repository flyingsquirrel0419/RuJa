  test262-full:
    needs: [build, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.setup.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - name: Make RuJa executable
        run: chmod +x target/release/ruja
      - name: Checkout pinned test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
      - name: Run test262 /${{ matrix.dir }}
        run: |
          DIR="${{ matrix.dir }}"
          SAFE_DIR="${DIR//\//_}"
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py "$DIR" > "test262_${SAFE_DIR}_result.txt" 2>&1
          cat "test262_${SAFE_DIR}_result.txt"
      - name: Require Function.prototype.toString boundary to pass
        if: matrix.dir == 'built-ins'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/Function/prototype/toString \
            > function_tostring_result.txt 2>&1
          cat function_tostring_result.txt
          grep -q '^RATE=100.0 PASS=80 FAIL=0 SKIP=0 TOTAL=80 RAN=80$' \
            function_tostring_result.txt
      - name: Require Map and Set prototype tags to pass
        if: matrix.dir == 'built-ins'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/Map/prototype/Symbol.toStringTag.js \
            built-ins/Set/prototype/Symbol.toStringTag.js \
            built-ins/Set/prototype/Symbol.toStringTag/property-descriptor.js \
            > collection_tag_result.txt 2>&1
          cat collection_tag_result.txt
          grep -q '^RATE=100.0 PASS=3 FAIL=0 SKIP=0 TOTAL=3 RAN=3$' \
            collection_tag_result.txt
      - name: Require ShadowRealm boundary to pass
        if: matrix.dir == 'built-ins'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/ShadowRealm > shadowrealm_result.txt 2>&1
          cat shadowrealm_result.txt
          grep -q '^RATE=100.0 PASS=64 FAIL=0 SKIP=0 TOTAL=64 RAN=64$' \
            shadowrealm_result.txt
      - name: Require Annex B String legacy methods to pass
        if: matrix.dir == 'annexB'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            annexB/built-ins/String/prototype > annex_b_string_result.txt 2>&1
          cat annex_b_string_result.txt
          grep -q '^RATE=100.0 PASS=105 FAIL=0 SKIP=6 TOTAL=111 RAN=105$' \
            annex_b_string_result.txt
      - name: Require Annex B escape functions to pass
        if: matrix.dir == 'annexB'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            annexB/built-ins/escape annexB/built-ins/unescape \
            > annex_b_escape_result.txt 2>&1
          cat annex_b_escape_result.txt
          grep -q '^RATE=100.0 PASS=35 FAIL=0 SKIP=0 TOTAL=35 RAN=35$' \
            annex_b_escape_result.txt
      - name: Require Annex B Date legacy methods to pass
        if: matrix.dir == 'annexB'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            annexB/built-ins/Date > annex_b_date_result.txt 2>&1
          cat annex_b_date_result.txt
          grep -q '^RATE=100.0 PASS=24 FAIL=0 SKIP=0 TOTAL=24 RAN=24$' \
            annex_b_date_result.txt
      - name: Require RegExp compile boundary to pass
        if: matrix.dir == 'annexB'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            annexB/built-ins/RegExp/prototype/compile \
            annexB/built-ins/RegExp/prototype/Symbol.split \
            annexB/built-ins/RegExp/prototype/flags \
            > regexp_compile_result.txt 2>&1
          cat regexp_compile_result.txt
          grep -q '^RATE=100.0 PASS=26 FAIL=0 SKIP=0 TOTAL=26 RAN=26$' \
            regexp_compile_result.txt
      - name: Require legacy RegExp accessor boundary to pass
        if: matrix.dir == 'annexB'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            annexB/built-ins/RegExp/legacy-accessors \
            > regexp_legacy_accessors_result.txt 2>&1
          cat regexp_legacy_accessors_result.txt
          grep -q '^RATE=100.0 PASS=24 FAIL=0 SKIP=0 TOTAL=24 RAN=24$' \
            regexp_legacy_accessors_result.txt
      - name: Require complete Annex B RegExp policy scope
        if: matrix.dir == 'annexB'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            annexB/built-ins/RegExp > regexp_annex_b_result.txt 2>&1
          cat regexp_annex_b_result.txt
          grep -q '^RATE=100.0 PASS=62 FAIL=0 SKIP=0 TOTAL=62 RAN=62$' \
            regexp_annex_b_result.txt
      - name: Require primitive Reference boundary to pass
        if: matrix.dir == 'language/types'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            language/types/reference \
            language/statements/with \
            language/expressions/compound-assignment \
            > primitive_reference_result.txt 2>&1
          cat primitive_reference_result.txt
          grep -q '^RATE=100.0 PASS=664 FAIL=0 SKIP=0 TOTAL=664 RAN=664$' \
            primitive_reference_result.txt
      - name: Require complete class-elements boundary to pass
        if: matrix.dir == 'language/expressions'
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            language/expressions/class/elements \
            language/statements/class/elements \
            > class_elements_result.txt 2>&1
          cat class_elements_result.txt
          grep -q '^RATE=100.0 PASS=2962 FAIL=0 SKIP=0 TOTAL=2962 RAN=2962$' \
            class_elements_result.txt
      - name: Publish /${{ matrix.dir }} pass rate
        if: always()
        run: |
          DIR="${{ matrix.dir }}"
          SAFE_DIR="${DIR//\//_}"
          FILE="test262_${SAFE_DIR}_result.txt"
          rate=$(grep '^RATE=' "$FILE" | sed 's/RATE=//;s/ .*//')
          pass=$(grep '^RATE=' "$FILE" | sed 's/.*PASS=//;s/ .*//')
          fail=$(grep '^RATE=' "$FILE" | sed 's/.*FAIL=//;s/ .*//')
          total=$(grep '^RATE=' "$FILE" | sed 's/.*TOTAL=//;s/ .*//')
          {
            echo "## test262 /${{ matrix.dir }}"
            echo ""
            echo "**Pass rate: ${rate}%** - ${pass} passed, ${fail} failed, ${total} total"
            echo "(unsupported-feature tests are skipped)"
            echo ""
            echo "<details><summary>Full breakdown for /${{ matrix.dir }}</summary>"
            echo ""
            echo '```'
            cat "$FILE"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload /${{ matrix.dir }} result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-${{ strategy.job-index }}-result
          path: test262_*_result.txt

  summary:
    needs: test262-full
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all test262 results
        uses: actions/download-artifact@v4
        with:
          path: test262-results
          pattern: test262-*-result
      - name: Aggregate and publish
        run: |
          total_pass=0
          total_fail=0
          total_skip=0
          total_total=0
          for f in test262-results/test262-*-result/*_result.txt; do
            [ -f "$f" ] || continue
            pass=$(grep '^RATE=' "$f" | sed 's/.*PASS=//;s/ .*//')
            fail=$(grep '^RATE=' "$f" | sed 's/.*FAIL=//;s/ .*//')
            skip=$(grep '^RATE=' "$f" | sed 's/.*SKIP=//;s/ .*//')
            total=$(grep '^RATE=' "$f" | sed 's/.*TOTAL=//;s/ .*//')
            total_pass=$((total_pass + ${pass:-0}))
            total_fail=$((total_fail + ${fail:-0}))
            total_skip=$((total_skip + ${skip:-0}))
            total_total=$((total_total + ${total:-0}))
          done
          ran=$((total_pass + total_fail))
          if [ "$ran" -gt 0 ]; then
            rate=$(awk "BEGIN { printf \"%.1f\", $total_pass * 100 / $ran }")
          else
            rate=0.0
          fi
          {
            echo "## test262 conformance (full, aggregate)"
            echo ""
            echo "**Pass rate: ${rate}%** - ${total_pass} passed, ${total_fail} failed, ${total_skip} skipped, ${total_total} total"
            echo ""
            echo '```'
            echo "Total tests: ${total_total}"
            echo "Actually run:  ${ran}"
            echo "Passed:        ${total_pass}"
            echo "Failed:        ${total_fail}"
            echo "Skipped:       ${total_skip}"
            echo "Pass rate:     ${rate}%"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
