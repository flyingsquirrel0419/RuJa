        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.RegExpUnicodeSetsAdmissionTests
          -v
      - name: Verify exact RegExp named-group admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.RegExpNamedGroupsAdmissionTests
          -v
      - name: Verify exact residual Annex B RegExp admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_regexp_annex_b_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Build directory matrix
        id: dirs
        run: |
          # Enumerate test262/test children. language/ is expanded into its
          # subdirectories; do not also include language/ itself.
          dirs=$(cd test262/test && {
            find . -maxdepth 1 -mindepth 1 -type d | sed 's|^\./||' | grep -vxE 'harness|language|intl402|staging'
            find ./language -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sed 's|^\./||'
            printf '%s\n' \
              staging/built-ins/Object/preventExtensions \
              staging/built-ins/Reflect/preventExtensions
          } | sort -u | jq -R . | jq -s -c .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "matrix directories: $dirs"

  regexp-unicode-sets:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned test262 RegExp string sets
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/RegExp/unicodeSets/generated
            test/built-ins/RegExp/property-escapes/generated/strings
      - name: Require all 142 RegExp Unicode-set files to pass
        run: |
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            built-ins/RegExp/unicodeSets/generated \
            built-ins/RegExp/property-escapes/generated/strings \
            > regexp_unicode_sets_result.txt 2>&1
          cat regexp_unicode_sets_result.txt
          grep -q '^RATE=100.0 PASS=142 FAIL=0 SKIP=0 TOTAL=142 RAN=142$' \
            regexp_unicode_sets_result.txt

  suppressed-error:
    needs: [build, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RuJa binary
        uses: actions/download-artifact@v4
        with:
          name: ruja-release
          path: target/release/
      - run: chmod +x target/release/ruja
      - name: Checkout pinned SuppressedError tests
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout: |
            harness
            test/built-ins/SuppressedError
      - name: Require the exact SuppressedError boundary to pass
        run: |
          mapfile -t files < <(sed -e '/^#/d' -e '/^$/d' \
            tools/test262_suppressed_error_admission.txt)
          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${files[@]}" > suppressed_error_result.txt 2>&1
          cat suppressed_error_result.txt
          grep -q '^RATE=100.0 PASS=22 FAIL=0 SKIP=0 TOTAL=22 RAN=22$' \
            suppressed_error_result.txt

  temporal-namespace:
    needs: [build, setup]
