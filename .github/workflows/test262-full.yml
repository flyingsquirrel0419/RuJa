          -v
      - name: Verify exact Temporal.ZonedDateTime compare admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_zoned_date_time_compare_manifest_is_exact_live_disjoint_and_shared
