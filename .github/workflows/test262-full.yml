          TEST262="$GITHUB_WORKSPACE/test262" python3 tools/test262_runner.py \
            "${files[@]}" > weak_reference_result.txt 2>&1
          cat weak_reference_result.txt
          grep -q '^RATE=100.0 PASS=76 FAIL=0 SKIP=0 TOTAL=76 RAN=76$' \
            weak_reference_result.txt
      - name: Require the full weak-reference scope to stay closed
