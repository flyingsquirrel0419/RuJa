# Full test262 conformance run split into parallel jobs by directory.
# Each runner processes one immediate child directory of test262/test,
# but language/ is expanded to its own subdirectories so the top-level
# language directory is not also re-run in full.

name: test262-full

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TEST262_REV: 9e61c12835c5e4a3bdba93850427e6742c4f64c4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build RuJa (release)
        run: cargo build --release
      - name: Upload RuJa binary
        uses: actions/upload-artifact@v4
        with:
          name: ruja-release
          path: target/release/ruja

  setup:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
      - name: Verify exact TypedArray string admissions
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.TypedArrayJoinAdmissionTests
          test262_tooling_test.TypedArrayToStringAdmissionTests
          test262_tooling_test.TypedArrayToLocaleStringAdmissionTests -v
      - name: Verify exact language early-error admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_language_early_error_admission_is_exact_and_shared
          -v
      - name: Verify exact module class-elements admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_module_class_elements_manifest_is_exact_and_shared
          -v
      - name: Verify exact class built-in subclass admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ClassSubclassBuiltinAdmissionTests
          -v
      - name: Verify exact SuppressedError admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_suppressed_error_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal namespace admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_namespace_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant core admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_core_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant.compare admission
        working-directory: tools
