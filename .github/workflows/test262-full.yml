      - name: Verify exact Temporal.PlainDate equals admissions
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_plain_date_equals_manifests_are_exact_live_and_shared
