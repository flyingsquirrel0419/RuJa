          -v
      - name: Verify exact Temporal.Instant equals admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_equals_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant valueOf admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_value_of_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant.from admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_from_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant string parser admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_string_parser_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Temporal.Instant.prototype.toString admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_temporal_instant_to_string_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact static import-attribute admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_static_import_attributes_manifest_is_exact_live_and_shared
          -v
      - name: Verify exact Function.prototype.bind admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_function_bind_admission_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Function.prototype.toString admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_function_tostring_admission_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact ShadowRealm admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_shadowrealm_admission_is_exact_live_and_shared
          -v
      - name: Verify exact Annex B String admission
        working-directory: tools
        run: >-
          TEST262="$GITHUB_WORKSPACE/test262" python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_annex_b_string_manifest_is_exact_live_disjoint_and_shared
          -v
      - name: Verify exact Annex B escape admission
        working-directory: tools
        run: >-
