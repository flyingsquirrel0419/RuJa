        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ env.TEST262_REV }}
          path: test262
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /harness/
            /test/intl402/Intl/builtin.js
            /test/intl402/Intl/toStringTag/
            /test/intl402/Intl/getCanonicalLocales/
      - name: Verify the frozen Intl manifest against the pinned checkout
        run: >-
          PYTHONPATH=tools TEST262="$GITHUB_WORKSPACE/test262"
          python3 -m unittest
          test262_tooling_test.ModuleCoreAdmissionTests.test_intl_canonical_locales_manifest_is_exact_live_and_shared
      - name: Require the exact Intl boundary to pass
        run: |
