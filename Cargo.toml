[package]
name = "ruja"
version = "0.4.0-alpha"
edition = "2021"
authors = ["flyingsquirrel0419"]
description = "A sandboxed, embeddable JavaScript runtime for untrusted scripts in Rust"
license = "Apache-2.0"
repository = "https://github.com/flyingsquirrel0419/RuJa"
homepage = "https://github.com/flyingsquirrel0419/RuJa"
readme = "README.md"
keywords = ["javascript", "sandbox", "embedded", "runtime", "scripting"]
categories = ["compilers", "embedded"]


[dependencies]
indexmap = "=2.2.6"
regex = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
parking_lot = "0.12"
serde_json = { version = "1", optional = true }
unicode-ident = "1"

[features]
default = []
serde = ["serde_json"]

[lib]
name = "ruja"
path = "src/lib.rs"

[[bench]]
name = "basic"
harness = false

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "ruja"
path = "src/bin/ruja.rs"
